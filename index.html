<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Secret Santa 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body><div id="app"></div><script src="app.js"></script><script src="messages.js"></script><script src="mailbox.js"></script><script src="mailbox-ui.js"></script><script src="free-send.js"></script><script src="mailbox-tab.js"></script><script>
(function(){
  document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gestureend',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  let lastTouchEnd=0;
  document.addEventListener('touchend',function(e){
    const now=Date.now();
    if(now-lastTouchEnd<=300)e.preventDefault();
    lastTouchEnd=now;
  },{passive:false});
})();
</script></body>
</html>
